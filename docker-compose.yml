services:
  # ============================================================================
  # 🚦 ANPR Sentry - Web Dashboard & FastAPI Service
  # ============================================================================
  anpr-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: anpr-sentry:latest
    container_name: anpr-sentry-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent SQLite database & detection logs
      - ./data:/app/data
      # Persistent plate crops and uploaded/annotated video media
      - ./media:/app/media
      # Model weights (.pt, LoRA adapter, compiled Linux .engine)
      - ./Weight:/app/Weight
      # Runtime configuration parameters
      - ./config:/app/config
      # HuggingFace base model cache (prevents redownloading Qwen2-VL)
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/system/status" ]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  # ============================================================================
  # 🛠️ ANPR Sentry - CLI Tool Runner (Offline Benchmarks & Pipeline Testing)
  # Run via: docker compose --profile tools run --rm anpr-cli <command>
  # ============================================================================
  anpr-cli:
    image: anpr-sentry:latest
    container_name: anpr-sentry-cli
    profiles: ["tools"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./Weight:/app/Weight
      - ./config:/app/config
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["python3"]
    command: ["scripts/benchmark_paddleocr.py"]

volumes:
  hf_cache:
    name: anpr_huggingface_cache
